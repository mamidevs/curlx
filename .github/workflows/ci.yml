name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff
        run: uv run ruff check src tests examples

      - name: Mypy
        run: uv run mypy

      # Integration tests need the network and run in a separate job.
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  integration:
    name: integration (real curl_cffi + network)
    runs-on: ubuntu-latest
    # Network-dependent by design: an httpbin.org outage must not redden the
    # branch, but the result stays visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Integration tests
        run: uv run pytest -m integration -q --no-cov
