[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curlx"
version = "0.3.0"
description = "Production-grade async/sync HTTP client SDK built on curl_cffi for stealth web crawling"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "mamidevs", email = "dev@mamidevs.com"}
]
keywords = ["http", "client", "curl_cffi", "crawler", "bot-detection", "async", "requests"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 0.16 is the floor the impersonate profile table actually requires
    # (chrome146 / safari2601 / firefox147 / tor145) and the first release
    # exposing the typed curl_cffi.requests.exceptions hierarchy we map onto.
    "curl_cffi>=0.16.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mamidevs/curlx"
Repository = "https://github.com/mamidevs/curlx"
Issues = "https://github.com/mamidevs/curlx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
curlx = "curlx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=curlx --cov-report=term-missing --cov-fail-under=75"
markers = [
    "integration: exercises real curl_cffi and real network; deselect with -m 'not integration'",
]

[tool.coverage.run]
source = ["curlx"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # typer declares defaults via function calls in signatures
    "SIM108",  # ternaries are not always clearer than if/else
    "RUF022",  # __all__ is grouped by topic with comments, not sorted
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src/curlx"]
